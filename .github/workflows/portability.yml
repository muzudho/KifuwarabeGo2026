name: Portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore portability smoke
        run: dotnet restore KifuwarabeGo2026.Tests.GameOasis.Gui.Portability/KifuwarabeGo2026.Tests.GameOasis.Gui.Portability.csproj

      - name: Build Core and portability smoke
        run: dotnet build KifuwarabeGo2026.Tests.GameOasis.Gui.Portability/KifuwarabeGo2026.Tests.GameOasis.Gui.Portability.csproj --configuration Release --no-restore

      - name: Run portability checks
        run: dotnet run --project KifuwarabeGo2026.Tests.GameOasis.Gui.Portability/KifuwarabeGo2026.Tests.GameOasis.Gui.Portability.csproj --configuration Release --no-build

      - name: Restore cross-platform launcher checks
        run: dotnet restore KifuwarabeGo2026.Tests.Launcher/KifuwarabeGo2026.Tests.Launcher.csproj

      - name: Build launcher Core, Presentation, and platform adapters
        run: dotnet build KifuwarabeGo2026.Launcher.Presentation/KifuwarabeGo2026.Launcher.Presentation.csproj --configuration Release

      - name: Run launcher Core and OS adapter checks
        run: dotnet run --project KifuwarabeGo2026.Tests.Launcher/KifuwarabeGo2026.Tests.Launcher.csproj --configuration Release

  windows-distribution:
    name: Windows solution and GUI publish
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore solution
        run: dotnet restore KifuwarabeGo2026.slnx

      - name: Restore MonoGame content tools
        working-directory: KifuwarabeGo2026.Launcher
        run: dotnet tool restore

      - name: Build all projects
        run: dotnet build KifuwarabeGo2026.slnx --configuration Release --no-restore

      - name: Run Windows platform checks
        run: dotnet run --project KifuwarabeGo2026.Tests.GameOasis.Gui.Windows/KifuwarabeGo2026.Tests.GameOasis.Gui.Windows.csproj --configuration Release --no-build

      - name: Run launcher checks
        run: dotnet run --project KifuwarabeGo2026.Tests.Launcher/KifuwarabeGo2026.Tests.Launcher.csproj --configuration Release --no-build

      - name: Restore Windows GUI for win-x64
        run: dotnet restore KifuwarabeGo2026.GameOasis.Gui.Windows/KifuwarabeGo2026.GameOasis.Gui.Windows.csproj --runtime win-x64

      - name: Publish Windows GUI
        run: dotnet publish KifuwarabeGo2026.GameOasis.Gui.Windows/KifuwarabeGo2026.GameOasis.Gui.Windows.csproj --configuration Release --runtime win-x64 --self-contained false --no-restore

      - name: Publish Windows launcher
        run: dotnet publish KifuwarabeGo2026.Launcher/KifuwarabeGo2026.Launcher.csproj --configuration Release --runtime win-x64 --self-contained false

      - name: Verify GUI distribution
        shell: pwsh
        run: |
          $publish = 'KifuwarabeGo2026.GameOasis.Gui.Windows/bin/Release/net8.0-windows/win-x64/publish'
          $required = @(
            'KifuwarabeGo2026.GameOasis.Gui.exe',
            'KifuwarabeGo2026.GameOasis.Gui.dll',
            'KifuwarabeGo2026.StationeryUI.dll',
            'KifuwarabeGo2026.Shared.dll',
            'Content/Fonts/Ui.xnb',
            'Content/Fonts/BoardCoordinate.xnb',
            'Tools/Cgos/KifuwarabeGo2026.GameOasis.Gui.Communication.Cgos.exe',
            'Tools/Cgos/KifuwarabeGo2026.GameOasis.Gui.Communication.Cgos.dll',
            'Tools/Cgos/KifuwarabeGo2026.GameOasis.Gui.Communication.Cgos.deps.json',
            'Tools/Cgos/KifuwarabeGo2026.GameOasis.Gui.Communication.Cgos.runtimeconfig.json'
          )
          $missing = $required |
            Where-Object { -not (Test-Path -LiteralPath (Join-Path $publish $_)) }
          if ($missing.Count -gt 0) {
            throw "Missing GUI distribution files: $($missing -join ', ')"
          }
          & (Join-Path $publish 'Tools/Cgos/KifuwarabeGo2026.GameOasis.Gui.Communication.Cgos.exe') --help
